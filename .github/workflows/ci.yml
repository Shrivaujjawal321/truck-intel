# truck-intel CI.
#
# This ran for the first time on 2026-07-27, the day the repo got a remote, and
# it failed twice before going green — both times on real defects it was the
# first thing to notice:
#   1. a folded YAML scalar put a line-continuation backslash mid-statement
#   2. schema_tracking.sql referenced core.truck_routes, whose schema file had
#      no Makefile target and had only ever been applied by hand
# The second one only appears on a database built from the repo alone, which is
# the whole argument for a clean container every run.
#
# `make ci` runs the same steps in the same order locally — keep the two in step.
#
# The two jobs are split by what they need:
#   fast   — no database, seconds. Everything that can fail without PostGIS.
#   full   — spins up PostGIS and runs the whole suite (~11 min locally).
# A pull request gets both; a push to a branch gets `fast` only, because
# waiting 11 minutes to learn about a syntax error is how CI gets ignored.
# `full` also runs nightly on a schedule — see the `on:` block for why.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The full suite is gated on `pull_request` below. This repo has zero PRs —
  # it is solo direct-push — so before 2026-08-18 the PostGIS suite had never
  # run automatically even once, and its last manual run was 15 commits stale.
  # A nightly run against main is what actually closes that hole.
  schedule:
    - cron: '30 20 * * *'   # 20:30 UTC = 02:00 IST, after the local timers settle

concurrency:
  # A newer push makes an in-flight run irrelevant; don't burn minutes on it.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast (no database)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # preflight_secrets.sh asks whether .env was EVER committed. The
          # default depth-1 checkout has no history to answer that with, so the
          # check would pass vacuously — the worst kind of green.
          fetch-depth: 0

      # First step on purpose: needs nothing installed, and a published
      # credential should stop the build before anything slower runs.
      # Added 2026-08-18, after a review found the live database password was
      # the dev default committed to this (public) repo.
      - name: Preflight — no published secrets
        run: ./scripts/preflight_secrets.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      # Catches the failure mode a unit file cannot: a script that no longer
      # imports. The scheduled jobs are scripts, not library code, so nothing
      # else would notice until 05:00.
      - name: Byte-compile every script
        run: uv run python -m compileall -q scripts truckintel api

      # The list lives in the Makefile's FAST_TESTS and nowhere else. It was
      # spelled out here too until 2026-08-18; a test added to one copy and not
      # the other simply would not run, and nothing would say so.
      - name: Fast tests
        run: make test-fast

      # Registry YAML is config that reaches SQL, so a typo here is a
      # production failure, not a lint nit. load_registry validates the
      # allow-listed target, the parser module's importability and the
      # positive-int schedule fields.
      # Block scalar, not a folded one with a backslash: YAML folds the newline
      # to a space and the `\` survives as a literal line-continuation
      # character mid-statement, which Python rejects. Caught by this workflow's
      # own first run.
      # Cheap and DB-free, so it belongs here rather than in `full`: the apply
      # order is the single source the schema step below reads, and a file
      # missing from it is exactly the defect this check exists for.
      - name: Check schema apply order
        run: ./scripts/check_schema_order.sh

      - name: Validate the source registry
        run: |
          uv run python - <<'PY'
          from truckintel.registry import load_registry
          srcs = load_registry("registry")
          print(f"{len(srcs)} sources valid")
          PY

      # The pipeline's own checks that need no DB: every deploy/ unit exists,
      # its ExecStart resolves to a real script, and every flag it passes is
      # one the script actually accepts.
      #
      # `--units-only` and no `|| true`, both since 2026-08-18. The bare call
      # needs a database and this job has none, so it crashed on every push and
      # the discarded exit code hid that — the drift check had been dead for
      # its entire life. Now it runs the repo-answerable checks and its failure
      # actually fails the build.
      - name: Pipeline unit-file checks
        run: uv run python scripts/pipeline_smoke.py --units-only

  full:
    name: full suite (PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Only on PRs and manual runs: an 11-minute suite on every branch push
    # trains people to stop reading CI.
    if: github.event_name != 'push'
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: truckintel
          POSTGRES_PASSWORD: truckintel
          POSTGRES_DB: truckintel
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://truckintel:truckintel@127.0.0.1:5432/truckintel
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      # Order is a dependency chain, not a preference: schema_tracking.sql
      # references core.truck_routes, which only schema_routes.sql creates.
      # That file had no Makefile target at all until 2026-07-27 — it was
      # applied by hand — so a database built from the repo alone was missing
      # it and this step failed on the dangling reference. Building on a clean
      # container every run is precisely what surfaced it.
      # The list lives in sql/apply-order.txt, which `make schema-all` and the
      # bootstrap doc also read. It used to be spelled out here by hand, and on
      # 2026-08-18 this copy — along with the other two — was found to be
      # missing sql/schema_liveness.sql, added the day before.
      - name: Apply schema
        run: |
          grep -vE '^[[:space:]]*(#|$)' sql/apply-order.txt | while read -r f; do
            echo "--- sql/$f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "sql/$f"
          done

      - name: Full test suite
        run: uv run pytest -q
