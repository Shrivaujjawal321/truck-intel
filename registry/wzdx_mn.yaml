# WZDx work zones — Minnesota DOT (CARS program), verified live 2026-07-22
# (research/live-ops.md §1.1 + §2.2: "mn.carsprogram.org/carsapi_v1/api/wzdx
# (MN, open)" — license-verified open, auth "None"; federal WZDx Feed Registry
# row: active=true, needAPIKey empty, version 4).
# License evidence: MN state open data via the USDOT WZDx registry (registry
# itself US-government public domain); endpoint keyless — re-fetched today:
# HTTP 200, WZDx v4.0 (empty feed_info — parser handles it), 640 events.
# CAVEAT (research §"adversarial pass"): this feed timed out once during
# research verification — the feed-health circuit breaker exists for exactly
# this feed.
id: wzdx_mn
name: WZDx work zones — Minnesota DOT (CARS)
owner: Minnesota DOT
url: https://mn.carsprogram.org/carsapi_v1/api/wzdx
kind: live_json
load_pattern: event_lifecycle
parser: wzdx
# 60, not the 15 the other WZDx feeds use, since 2026-08-18. This feed hangs:
# 84 of 175 runs in 7 days failed on "Read timed out (60s)", and after
# polite_get gained a retry the failures that remained were runs where BOTH
# attempts hung (133s and 142s wall time). It is not slow — asked by hand it
# returns 1.5 MB in 3.5 s — it stalls, roughly every other attempt.
#
# The SLO is 24 h. Polling a visibly struggling state-DOT server 96 times a
# day for data that may be a day old is over-polling on its own terms, and it
# was the single largest source of failed runs in the whole pipeline. Hourly is
# still 24x more often than the budget requires, and it is kinder to a server
# that is plainly having a hard time. The CAVEAT above already predicted this.
schedule_minutes: 60
slo_hours: 24                  # work zones move slower than weather alerts
license: MN state open data (USDOT WZDx Feed Registry, open/no-key)
attribution: "Minnesota DOT (WZDx / CARS program)"
gates:
  min_rows: 0                  # zero active work zones is a legitimate state
  max_row_delta_pct: null      # row-delta gate is not meaningful for event feeds
  required_fields: [event_id, kind]   # gate 1 (pipeline.md required_columns) - lifecycle
                               # tracking is keyed on event_id
auth: null
