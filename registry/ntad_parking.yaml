# (plan §10 Phase-1 risk).
# HONESTY: observed_at for these rows is the ~2019 Jason's Law survey era,
# never the download date.
id: ntad_parking
name: NTAD Truck Stop Parking (BTS)
owner: Bureau of Transportation Statistics (BTS), US DOT
url: https://services.arcgis.com/xOi1kZaI0eWDREZv/arcgis/rest/services/NTAD_Truck_Stop_Parking/FeatureServer
kind: arcgis
load_pattern: snapshot_swap
