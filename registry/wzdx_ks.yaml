# WZDx work zones — Kansas DOT (CARS program), verified live 2026-07-22
# (research/live-ops.md §1.1 + §2.2: "ks.carsprogram.org/carsapi_v1/api/wzdx
# (KS, open)" — license-verified open, auth "None"; federal WZDx Feed Registry
# row: active=true, needAPIKey empty, version 4).
