# Gate every network-touching scheduled job on DNS actually working.
#
# Read this before deleting it — the obvious guard is already there and is a lie.
#
# Every unit in deploy/ carries:
#     After=network-online.target
#     Wants=network-online.target
# Both are no-ops. network-online.target does not exist in the systemd *user*
# manager — it is a system-manager target:
#     $ systemctl --user status network-online.target
#     Unit network-online.target could not be found.
#     $ systemctl status network-online.target
#     Active: active since Mon 2026-08-03 15:35:48 IST
# So the ordering constraint binds to nothing and the units start whenever the
# user manager gets to them.
#
# That matters because 13 of the 14 timers set Persistent=true. The daily jobs
# are scheduled 03:10-06:15, the laptop is off then, and systemd fires the whole
# catch-up batch within seconds of login — before NetworkManager has resolution
# up. truckintel-aaa-prices.service lost that race 6 times against 3 wins:
#     [aaa] FAILED: ConnectionError ... Failed to resolve 'gasprices.aaa.com'
#           ([Errno -3] Temporary failure in name resolution)
# The one success on 2026-08-03 ran at 09:40 rather than 09:19 — late enough by
# accident. Type=oneshot forbids Restart=, so nothing absorbs the miss: one DNS
# failure is that day's data gone.
#
# getent, not ping or curl: it goes through NSS, the same resolution path
# requests/urllib take, so this tests what the job will actually do. Bounded at
# 120s — a boot race resolves in 10-30s, and a unit that hangs forever waiting
# is worse than one that fails visibly.

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 24); do getent hosts one.one.one.one >/dev/null 2>&1 && exit 0; sleep 5; done; echo "wait-dns: no name resolution after 120s, giving up" >&2; exit 1'
