# Wait for name resolution before starting. Applies only to the jobs that
# actually reach the network -- the DB-only ones (quality, nightly-checks,
# track-prune, fuel-verify) would pay the latency for nothing.
#
# The unit's own After/Wants=network-online.target is a no-op in the user
# manager; that target does not exist there. truckintel-aaa-prices lost the
# resulting race 6 times against 3 wins, each time on
# "Failed to resolve 'gasprices.aaa.com'".
#
# Numbered after 10-wait-db so the database check runs first: it is the
# cheaper failure to hit, and a job with no database has nothing to do with a
# resolved hostname anyway.
#
# See scripts/wait_ready.sh for the full reasoning.

[Service]
ExecStartPre=%h/Documents/truck-intel/scripts/wait_ready.sh --dns
