# Put this job in truckintel-batch.slice so it yields CPU to interactive work.
# See deploy/truckintel-batch.slice for why (Persistent=true catch-up lands the
# whole daily batch in one 41 ms burst at login).
#
# Applied to the timer-driven jobs only. api and worker are long-running
# services Boss actually waits on, and tick is a few seconds every minute --
# deprioritising either buys nothing and costs latency.

[Service]
Slice=truckintel-batch.slice
