# Wait for Postgres before starting. Applies to every timer-driven job, since
# all of them talk to the database.
#
# The unit's own After=docker.service is a no-op -- these are user units and
# docker.service is a system service, so the ordering binds to nothing. On
# 2026-08-03 truckintel-businesses started 92 seconds after login and died on
# "connection to server at 127.0.0.1, port 5432 failed: Connection refused"
# before the truckintel-pg container was up. Its timer is OnCalendar=*-*-01,
# so that single miss cost the entire monthly rebuild -- nothing retried.
#
# See scripts/wait_ready.sh for the full reasoning and why the check lives in
# a script instead of inline here.

[Service]
ExecStartPre=%h/Documents/truck-intel/scripts/wait_ready.sh --db
